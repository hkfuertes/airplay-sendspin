name: Add-on image

# Publishes the image Home Assistant pulls; bump version in
# airplay-sendspin/config.yaml to release.
on:
  push:
    branches: [main]
    paths: [airplay-sendspin/config.yaml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(sed -n 's/^version: *"\(.*\)"$/\1/p' airplay-sendspin/config.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: addon
          platforms: linux/amd64
          push: true
          build-args: BUILD_VERSION=${{ steps.version.outputs.version }}
          tags: ghcr.io/${{ github.repository_owner }}/airplay-sendspin-amd64:${{ steps.version.outputs.version }}
