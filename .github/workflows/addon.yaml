name: Add-on image

# Publishes the image Home Assistant pulls; bump version in
# airplay-sendspin/config.yaml to release.
on:
  push:
    branches: [main]
    paths: [airplay-sendspin/config.yaml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    # Native runners avoid local/QEMU cross-compilation; build one image at a time.
    strategy:
      max-parallel: 1
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64, runner: ubuntu-24.04 }
          - { arch: aarch64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          echo "version=$(sed -n 's/^version: *"\(.*\)"$/\1/p' airplay-sendspin/config.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: addon
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.version.outputs.version }}
          tags: ghcr.io/${{ github.repository_owner }}/airplay-sendspin-${{ matrix.arch }}:${{ steps.version.outputs.version }}
