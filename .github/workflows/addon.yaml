name: Add-on image

# Publishes the image Home Assistant pulls after a version bump reaches main.
on:
  push:
    branches: [main]
    paths: [sendspin-bridge/config.yaml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    strategy:
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64, runner: ubuntu-24.04 }
          - { arch: aarch64, platform: linux/arm64, runner: ubuntu-24.04-arm }
          - { arch: armv7, platform: linux/arm/v7, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          echo "version=$(sed -n 's/^version: *"\(.*\)"$/\1/p' sendspin-bridge/config.yaml)" >> "$GITHUB_OUTPUT"
      # ponytail: arm/v7 needs QEMU on the ARM64 runner; switch to native if builds time out.
      - uses: docker/setup-qemu-action@v3
        if: matrix.arch == 'armv7'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: addon
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.version.outputs.version }}
          tags: ghcr.io/${{ github.repository_owner }}/sendspin-bridge:${{ steps.version.outputs.version }}-${{ matrix.arch }}

  manifest:
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform tag
        run: |
          version=$(sed -n 's/^version: *"\(.*\)"$/\1/p' sendspin-bridge/config.yaml)
          image=ghcr.io/${{ github.repository_owner }}/sendspin-bridge
          docker buildx imagetools create -t "$image:$version" \
            "$image:$version-amd64" "$image:$version-aarch64" "$image:$version-armv7"
          docker buildx imagetools inspect "$image:$version"
          docker buildx imagetools inspect --raw "$image:$version" | jq -e '
            [.manifests[].platform | select(.os == "linux")] |
            any(.[]; .architecture == "amd64") and
            any(.[]; .architecture == "arm64") and
            any(.[]; .architecture == "arm" and .variant == "v7")'
